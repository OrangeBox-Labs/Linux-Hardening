name: Shell syntax validation

on:
  push:
    paths:
      - "*.sh"
      - "**/*.sh"
      - ".github/workflows/shell-syntax.yml"
  pull_request:
    paths:
      - "*.sh"
      - "**/*.sh"
      - ".github/workflows/shell-syntax.yml"

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate all Bash scripts
        run: |
          find . -path './.git' -prune -o -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
      - name: Verify executable bits on entrypoint scripts
        run: |
          test -x ./linux-hardening.sh
          test -x ./audit-firewall-listeners.sh
          test -x ./kernel-lpe-2026-mitigation.sh
          test -x ./configure-login-banners.sh
          test -x ./linux-hardening-audit.sh
          test -x ./audit-listening-services.sh
          test -x ./remove-gui-hardening.sh
          test -x ./ssh-hardening.sh
      - name: Test legacy OS release detection
        run: bash tests/test_os_detection_legacy.sh
      - name: Test legacy auditd and GRUB coverage
        run: bash tests/test_legacy_audit_modules.sh
      - name: Test legacy ntpd periodic refresh guard
        run: bash tests/test_time_sync_legacy_refresh.sh
      - name: Test CIS profile mapping and checker quality
        run: bash tests/test_cis_checker_quality.sh
      - name: Test audit output accuracy
        run: bash tests/test_audit_output_accuracy.sh
      - name: Test Bash history deletion guard
        run: bash tests/test_bash_history_guard.sh
      - name: Test Bash FQDN prompt and Readline bindings
        run: bash tests/test_bash_prompt_fqdn.sh
      - name: Test socket audit classification
        run: bash tests/test_audit_listening_services.sh
      - name: Test systemd and SysV service compatibility helpers
        run: bash tests/test_service_compat.sh
      - name: Test firewall backend and Imunify detection
        run: bash tests/test_firewall_detect.sh
      - name: Test listener firewall coverage audit
        run: bash tests/test_listener_firewall_audit.sh
      - name: Test actionable baseline scope and standalone firewall audit
        run: bash tests/test_main_audit_scope.sh
      - name: Test SYN flood baseline policy
        run: bash tests/test_synflood_defaults.sh
      - name: Test SSH effective-setting preflight
        run: bash tests/test_ssh_preflight.sh
      - name: Test idempotent confirmations, MOTD and shell timeout
        run: bash tests/test_idempotent_baseline.sh
      - name: Test operational policy guards
        run: bash tests/test_policy_guards.sh
      - name: Test filesystem fix safety
        run: bash tests/test_fs_safety_guard.sh
      - name: Test companion module consent routing
        run: bash tests/test_companion_consent_routing.sh
      - name: Test sudo consent and syntax validation
        run: bash tests/test_sudo_consent.sh
      - name: Test SELinux guarded transition
        run: bash tests/test_selinux_fix_guard.sh
      - name: Test kernel.kptr_restrict policy
        run: bash tests/test_kptr_restrict_policy.sh

  # Syntax/tests on representative RPM-family generations. CentOS 6/7 cover
  # legacy Bash releases; AlmaLinux 8/9/10 cover modern RHEL-compatible userspace.
  # These containers do not constitute certification on the exact RHEL products.
  compatibility-smoke:
    name: Compatibility smoke (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: CentOS 6 legacy baseline
            image: centos:6
          - label: CentOS 7 legacy baseline
            image: centos:7
          - label: AlmaLinux 8
            image: almalinux:8
          - label: AlmaLinux 9
            image: almalinux:9
          - label: AlmaLinux 10
            image: almalinux:10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run syntax and regression tests in ${{ matrix.label }}
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker pull "$TEST_IMAGE"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$TEST_IMAGE" /bin/bash -c '
              set -eu
              printf "OS: "
              if [ -r /etc/centos-release ]; then cat /etc/centos-release
              elif [ -r /etc/almalinux-release ]; then cat /etc/almalinux-release
              else cat /etc/os-release 2>/dev/null || true
              fi
              /bin/bash --version | head -n 1
              find . -path "./.git" -prune -o -type f -name "*.sh" -print0 |
                xargs -0 -r -n1 /bin/bash -n
              /bin/bash tests/test_os_detection_legacy.sh
              /bin/bash tests/test_time_sync_legacy_refresh.sh
              /bin/bash tests/test_cis_checker_quality.sh
              /bin/bash tests/test_bash_history_guard.sh
              if command -v script >/dev/null 2>&1; then
                /bin/bash tests/test_bash_prompt_fqdn.sh
              else
                echo "[SKIP] La prueba PTY requiere util-linux script, ausente en esta imagen; se ejecuta completa en el job Ubuntu."
              fi
              /bin/bash tests/test_audit_listening_services.sh
              /bin/bash tests/test_firewall_detect.sh
              /bin/bash tests/test_listener_firewall_audit.sh
              /bin/bash tests/test_main_audit_scope.sh
              /bin/bash tests/test_synflood_defaults.sh
              /bin/bash tests/test_ssh_preflight.sh
              /bin/bash tests/test_idempotent_baseline.sh
              /bin/bash tests/test_kptr_restrict_policy.sh
              /bin/bash tests/test_selinux_fix_guard.sh
              /bin/bash tests/test_companion_consent_routing.sh
              /bin/bash tests/test_sudo_consent.sh
            '
